name: Publish Wose site

on:
  push:
    branches: [main]
    paths: [site/**, tools/generate-download-stats.mjs, .github/workflows/pages.yml]
  release:
    types: [published]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate validated GitHub download statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/generate-download-stats.mjs --repo "$GITHUB_REPOSITORY" --output site/download-stats.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
